name: Build BabyTV APK

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babytv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble BabyTV TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 直接用 runner 预装的 Android SDK，避免第三方 setup 动作在 Node24 下失效
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # 防止打出"没有声音"的 APK：题目音频 + 每选项音频 + 2 个反馈音必须齐全
      - name: Verify offline audio package
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("data/seed.json", encoding="utf-8"))
          missing = []
          for i, q in enumerate(data):
              if not os.path.exists(f"data/audio/q_{i}.mp3"):
                  missing.append(f"q_{i}.mp3")
              for j in range(len(q["a"])):
                  if not os.path.exists(f"data/audio/q_{i}_opt_{j}.mp3"):
                      missing.append(f"q_{i}_opt_{j}.mp3")
          for f in ("sfx_correct.mp3", "sfx_wrong.mp3"):
              if not os.path.exists("data/audio/" + f):
                  missing.append(f)
          print(f"题库 {len(data)} 题，音频文件 {len(os.listdir('data/audio'))} 个")
          if missing:
              print("缺失音频，例如：", missing[:10], "共", len(missing))
              sys.exit(1)
          PY

      # 版本自动化：versionName=1.1.<run>，versionCode 在 build.gradle.kts 里取 run number
      - name: Compute version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BABYTV_VERSION=$VERSION" >> "$GITHUB_ENV"

      # 有 keystore secret 才出 release 签名包，否则回退 debug，保证流水线永不中断
      - name: Prepare signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，本次构建 debug 包"
          else
            mkdir -p "$GITHUB_WORKSPACE/keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore/release.p12"
            test -s "$GITHUB_WORKSPACE/keystore/release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "已载入 release 签名密钥"
          fi

      - name: Assemble release (signed)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: app/native
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.p12
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEYSTORE_TYPE: PKCS12
        run: gradle assembleTvRelease assembleMobileRelease --no-daemon --stacktrace

      - name: Assemble debug (fallback)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: app/native
        run: gradle assembleTvDebug assembleMobileDebug --no-daemon --stacktrace

      - name: Rename APKs
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            TV=app/native/app/build/outputs/apk/tv/release/app-tv-release.apk
            MOBILE=app/native/app/build/outputs/apk/mobile/release/app-mobile-release.apk
            SUFFIX=release
          else
            TV=app/native/app/build/outputs/apk/tv/debug/app-tv-debug.apk
            MOBILE=app/native/app/build/outputs/apk/mobile/debug/app-mobile-debug.apk
            SUFFIX=debug
          fi
          cp "$TV" "dist/BabyTV-v${VERSION}-tv-${SUFFIX}.apk"
          cp "$MOBILE" "dist/BabyTV-v${VERSION}-mobile-${SUFFIX}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabyTV-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # 打 tag 并发布到 GitHub Releases，提供固定下载地址
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BabyTV v${{ steps.ver.outputs.version }}
          body: |
            BabyTV 幼儿识字 / 英语 / 书写启蒙（离线语音）

            - 题库：识字 100 + 英语 100 + 书写 10，共 210 题
            - 语音：全量离线音频 832 个，无需联网、不依赖系统 TTS
            - 交互：电视遥控器 ←/→ 选择、OK 确认、MENU 再听一遍；手机/平板点按卡片
            - 出题：最近 30 题不重复，错题隔 5 题再现
            - 修复：答完第一题后界面卡死（输入锁未复位），现在可连续答题
            - 完成条件：累计答对 5 题才显示「太棒了！这一轮完成啦」，8 秒后回到电视桌面；答错继续出题
            - 默认严格模式（与上游一致）：答对 5 题解锁 10 分钟，每天 40 分钟、最多 3 轮；未通过时离开 App 会被学习页盖住（电视 + 平板）
            - 家长页可一键切换「答题锁屏 开/关」；平板首次引导会请求悬浮窗与使用情况访问权限
            - 退出：孩子端没有退出按钮、遥控器 BACK 不放行；家长页可「退出应用」，或设「休息 1/2/4 小时」
            - 家长：家长页可设「休息 1 / 2 / 4 小时」，期间孩子端不出题；手机打开 http://电视IP:8099/admin/ 管理
            - 修复：手机浏览器打开 /admin 空白（现在会 301 到 /admin/，静态资源才找得到）
            - 遥控器：↑ 选中「家长」、↓ 选中「再听一遍」、OK 触发；家长页按钮有焦点高亮，密码框聚焦有边框
            - 适配：电视 Android 5.0+（minSdk 21，海信 VIDAA 等）、手机/平板 Android 5.0+
            - 包名：电视 `com.babytv.tv`，手机/平板 `com.babytv.mobile`（可同时安装）
            - 签名：${{ steps.keystore.outputs.signed == 'true' && 'release keystore' || 'debug（未配置密钥）' }}

            下载：
            - 电视：`BabyTV-v${{ steps.ver.outputs.version }}-tv-${{ steps.keystore.outputs.signed == 'true' && 'release' || 'debug' }}.apk`
            - 手机/平板：`BabyTV-v${{ steps.ver.outputs.version }}-mobile-${{ steps.keystore.outputs.signed == 'true' && 'release' || 'debug' }}.apk`

            SHA256 见 `SHA256SUMS.txt`。
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
