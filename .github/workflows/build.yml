name: Build BabyTV APK

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: babytv-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble BabyTV TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 直接用 runner 预装的 Android SDK，避免第三方 setup 动作在 Node24 下失效
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # 防止打出"没有声音"的 APK：题目音频 + 每选项音频 + 2 个反馈音必须齐全
      - name: Verify offline audio package
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("data/seed.json", encoding="utf-8"))
          missing = []
          for i, q in enumerate(data):
              if not os.path.exists(f"data/audio/q_{i}.mp3"):
                  missing.append(f"q_{i}.mp3")
              for j in range(len(q["a"])):
                  if not os.path.exists(f"data/audio/q_{i}_opt_{j}.mp3"):
                      missing.append(f"q_{i}_opt_{j}.mp3")
          for f in ("sfx_correct.mp3", "sfx_wrong.mp3"):
              if not os.path.exists("data/audio/" + f):
                  missing.append(f)
          print(f"题库 {len(data)} 题，音频文件 {len(os.listdir('data/audio'))} 个")
          if missing:
              print("缺失音频，例如：", missing[:10], "共", len(missing))
              sys.exit(1)
          PY

      # 版本自动化：versionName=1.1.<run>，versionCode 在 build.gradle.kts 里取 run number
      - name: Compute version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.1.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BABYTV_VERSION=$VERSION" >> "$GITHUB_ENV"

      # 有 keystore secret 才出 release 签名包，否则回退 debug，保证流水线永不中断
      - name: Prepare signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 KEYSTORE_BASE64，本次构建 debug 包"
          else
            mkdir -p "$GITHUB_WORKSPACE/keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore/release.p12"
            test -s "$GITHUB_WORKSPACE/keystore/release.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "已载入 release 签名密钥"
          fi

      - name: Assemble release (signed)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: app/native
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore/release.p12
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          KEYSTORE_TYPE: PKCS12
        run: gradle assembleTvRelease --no-daemon --stacktrace

      - name: Assemble debug (fallback)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: app/native
        run: gradle assembleTvDebug --no-daemon --stacktrace

      - name: Rename APK
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            SRC=app/native/app/build/outputs/apk/tv/release/app-tv-release.apk
            SUFFIX=release
          else
            SRC=app/native/app/build/outputs/apk/tv/debug/app-tv-debug.apk
            SUFFIX=debug
          fi
          cp "$SRC" "dist/BabyTV-v${VERSION}-tv-${SUFFIX}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabyTV-tv-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # 打 tag 并发布到 GitHub Releases，提供固定下载地址
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BabyTV v${{ steps.ver.outputs.version }}
          body: |
            BabyTV 幼儿识字 / 英语 / 数学启蒙 TV 版（离线语音）

            - 题库：识字 100 + 英语 96 + 数学 79，共 275 题
            - 语音：全量离线音频，无需联网、不依赖系统 TTS
            - 交互：遥控器 ←/→ 选择，OK 确认，MENU 再听一遍
            - 出题：最近 30 题不重复，错题隔 5 题再现
            - 适配：minSdk 21，Android 7.0（海信 VIDAA 等老电视）
            - 包名：`com.babytv.tv`；签名：${{ steps.keystore.outputs.signed == 'true' && 'release keystore' || 'debug（未配置密钥）' }}

            下载 `BabyTV-v${{ steps.ver.outputs.version }}-tv-${{ steps.keystore.outputs.signed == 'true' && 'release' || 'debug' }}.apk`，
            SHA256 见 `SHA256SUMS.txt`。
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
