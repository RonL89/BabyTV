name: Build BabyTV APK

on:
  push:
    branches: ["main", "master"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble BabyTV TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 直接用 runner 预装的 Android SDK，避免第三方 setup 动作在 Node24 下失效
      - name: Install Android SDK packages
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # 防止打出"没有声音"的 APK：题目音频 + 每选项音频 + 2 个反馈音必须齐全
      - name: Verify offline audio package
        run: |
          python3 - <<'PY'
          import json, os, sys
          data = json.load(open("data/seed.json", encoding="utf-8"))
          missing = []
          for i, q in enumerate(data):
              if not os.path.exists(f"data/audio/q_{i}.mp3"):
                  missing.append(f"q_{i}.mp3")
              for j in range(len(q["a"])):
                  if not os.path.exists(f"data/audio/q_{i}_opt_{j}.mp3"):
                      missing.append(f"q_{i}_opt_{j}.mp3")
          for f in ("sfx_correct.mp3", "sfx_wrong.mp3"):
              if not os.path.exists("data/audio/" + f):
                  missing.append(f)
          print(f"题库 {len(data)} 题，音频文件 {len(os.listdir('data/audio'))} 个")
          if missing:
              print("缺失音频，例如：", missing[:10], "共", len(missing))
              sys.exit(1)
          PY

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/native/app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VERSION"

      - name: Assemble
        working-directory: app/native
        run: gradle assembleTvDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/native/app/build/outputs/apk/tv/debug/app-tv-debug.apk \
             "dist/BabyTV-v${{ steps.ver.outputs.version }}-tv-debug.apk"
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabyTV-tv-debug
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      # 打 tag 并发布到 GitHub Releases，提供固定下载地址
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BabyTV v${{ steps.ver.outputs.version }}
          body: |
            BabyTV 幼儿识字 / 英语 / 数学启蒙 TV 版（离线语音）

            - 题库：识字 100 + 英语 96 + 数学 79，共 275 题
            - 语音：全量离线音频，无需联网、不依赖系统 TTS
            - 交互：遥控器 ←/→ 选择，OK 确认，切换选项自动朗读
            - 适配：minSdk 21，Android 7.0（海信 VIDAA 等老电视）

            下载 `BabyTV-v${{ steps.ver.outputs.version }}-tv-debug.apk`，
            SHA256 见 `SHA256SUMS.txt`。
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
