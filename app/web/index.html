<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BabyTV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0B1020;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: #fff;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    width: 100%; height: 100%;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    padding: 4vh 5vw;
  }
  /* 题干 */
  #stem {
    font-size: 5.2vh;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.35;
    color: #EAF0FF;
    text-shadow: 0 0.4vh 1.6vh rgba(0,0,0,.55);
    max-height: 22vh;
    overflow: hidden;
    margin-bottom: 3.5vh;
  }
  /* 选项：巨大卡片横排（用 margin 间距，兼容老 WebView 的 flex gap 缺失） */
  #options {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    width: 100%;
  }
  .card {
    width: 26vw; height: 26vw;
    max-width: 380px; max-height: 380px;
    min-width: 180px; min-height: 180px;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    border-radius: 4vh;
    background: #1C2440;
    background: -webkit-linear-gradient(top, #1C2440, #141A2E);
    background: linear-gradient(160deg, #1C2440, #141A2E);
    border: 0.7vh solid rgba(255,255,255,.10);
    box-shadow: 0 1.6vh 4vh rgba(0,0,0,.45);
    font-size: 12vw;
    font-weight: 900;
    line-height: 1;
    color: #FFFFFF;
    -webkit-transition: -webkit-transform .12s ease, border-color .12s ease;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .card + .card { margin-left: 4vw; }
  .card.en { font-size: 7.2vw; }
  .card.focused {
    border-color: #35E0B0;
    -webkit-transform: scale(1.06);
    transform: scale(1.06);
    box-shadow: 0 0 3vh rgba(53,224,176,.55), 0 1.6vh 4vh rgba(0,0,0,.45);
  }
  .card.correct {
    border-color: #35E0B0;
    background: #0C4436;
    background: -webkit-linear-gradient(top, #0C4436, #07281F);
    background: linear-gradient(160deg, #0C4436, #07281F);
  }
  .card.wrong {
    border-color: #FF5A6E;
    background: #4A1220;
    background: -webkit-linear-gradient(top, #4A1220, #2A0A12);
    background: linear-gradient(160deg, #4A1220, #2A0A12);
  }
  /* 底部提示 */
  #hint {
    font-size: 2.2vh;
    color: rgba(255,255,255,.32);
    letter-spacing: .18em;
    margin-top: 3.5vh;
  }
  #toast {
    position: fixed; left: 0; right: 0; top: 6vh;
    text-align: center;
    font-size: 2.4vh; color: rgba(255,255,255,.45);
    opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s;
  }
</style>
</head>
<body>
<div id="app">
  <div id="stem">准备开始…</div>
  <div id="options"></div>
  <div id="hint">← → 选择　OK 确认　MENU 再听一遍</div>
</div>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var round = null;      // 当前一轮（id / nonce / question）
  var cards = [];
  var focus = 0;
  var locked = false;    // 判题与播放反馈期间锁定输入
  var failed = 0;
  var stem = document.getElementById("stem");
  var optionsBox = document.getElementById("options");
  var toastBox = document.getElementById("toast");

  // ---------- 原生桥 ----------
  function nativeCall(name, args) {
    try {
      var api = window.SOTVNative;
      if (api && typeof api[name] === "function") return api[name].apply(api, args || []);
    } catch (e) { }
    return null;
  }
  function play(file) { if (file) nativeCall("playAudio", [file]); }
  function token() { return nativeCall("apiToken") || ""; }

  function toast(text) {
    toastBox.textContent = text || "";
    toastBox.style.opacity = text ? "1" : "0";
  }

  // 用 XHR 而不是 fetch：Android 7 自带 WebView 可能低于 Chrome 57
  function post(path, body, ok, fail) {
    var xhr = new XMLHttpRequest();
    var done = false;
    function finish(fn, arg) { if (done) return; done = true; fn(arg); }
    try {
      xhr.open("POST", path, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      var t = token();
      if (t) xhr.setRequestHeader("X-Device-Token", t);
      xhr.timeout = 8000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          var data = null;
          try { data = JSON.parse(xhr.responseText); } catch (e) { }
          if (data) finish(ok, data); else finish(fail);
        } else {
          finish(fail);
        }
      };
      xhr.ontimeout = function () { finish(fail); };
      xhr.onerror = function () { finish(fail); };
      xhr.send(JSON.stringify(body || {}));
    } catch (e) {
      finish(fail);
    }
  }

  // ---------- 渲染 ----------
  function isEnglish(text) { return /[A-Za-z]/.test(String(text)); }

  function render(r) {
    round = r;
    var q = r.question || r;
    stem.textContent = q.q || "";
    optionsBox.innerHTML = "";
    cards = [];

    var list = q.a || [];
    for (var i = 0; i < list.length; i++) {
      var el = document.createElement("div");
      el.className = "card" + (isEnglish(list[i]) ? " en" : "");
      el.textContent = list[i];
      el.setAttribute("role", "option");
      el.onclick = (function (index) { return function () { choose(index); }; })(i);
      optionsBox.appendChild(el);
      cards.push(el);
    }

    focus = 0;
    paintFocus();
    play(audioName(q, -1));   // 题目一出现就朗读题干
  }

  function audioName(q, index) {
    if (!q || !q.id) return "";
    return index < 0 ? q.id + ".mp3" : q.id + "_opt_" + index + ".mp3";
  }

  function paintFocus() {
    for (var i = 0; i < cards.length; i++) {
      var on = (i === focus);
      if (on) cards[i].className = cards[i].className.replace(/\s*focused/g, "") + " focused";
      else cards[i].className = cards[i].className.replace(/\s*focused/g, "");
    }
  }

  function moveFocus(delta) {
    if (locked || !cards.length) return;
    var next = focus + delta;
    if (next < 0 || next >= cards.length) return;
    focus = next;
    paintFocus();
    play(audioName(round.question, focus));  // 只有左右切换才读选项
  }

  // ---------- 取题 ----------
  function nextRound() {
    locked = false;
    failed = 0;
    post("/api/quiz/start", {}, function (data) {
      if (data.question) { render(data); return; }
      if (data.next && data.next.question) { render(data.next); return; }
      if (data.pending) { toast("等待家长批改"); return; }
      if (data.blocked) { showIdle("今天的学习时间结束啦"); return; }
      if (data.watching) { showIdle("先看会儿动画吧"); return; }
      if (data.reviewed) { toast("已批改"); nextRound(); return; }
      retry();
    }, retry);
  }

  function showIdle(text) {
    stem.textContent = text;
    optionsBox.innerHTML = "";
    cards = [];
  }

  function retry() {
    failed = failed + 1;
    showIdle(failed > 3 ? "连接失败，请重启应用" : "加载中…");
    setTimeout(nextRound, Math.min(1200 * failed, 5000));
  }

  // ---------- 答题 ----------
  function choose(index) {
    if (locked || !round || !cards.length) return;
    locked = true;
    focus = index;
    paintFocus();

    post("/api/quiz/answer", {
      roundId: round.id,
      nonce: round.nonce,
      selections: [index],
      text: "",
      drawing: ""
    }, function (result) {
      if (result.error || result.pending || result.blocked) {
        locked = false;
        toast("请稍后再试");
        return;
      }
      var correct = !!result.correct;
      cards[index].className += correct ? " correct" : " wrong";
      play(correct ? "sfx_correct.mp3" : "sfx_wrong.mp3");  // 先播反馈，再切题

      if (!correct) {
        // 答错：先让孩子看到正确答案，再把正确选项念一遍
        var arr = result.correctIndices || [];
        var answerIndex = arr.length ? Number(arr[0]) : -1;
        if (answerIndex >= 0 && cards[answerIndex]) {
          setTimeout(function () {
            cards[answerIndex].className += " correct";
            play(audioName(round.question, answerIndex));
          }, 1500);
        }
      }
      setTimeout(function () {
        if (result.next && result.next.question) render(result.next);
        else nextRound();
      }, correct ? 1500 : 3600);
    }, function () {
      locked = false;
      toast("网络异常");
    });
  }

  // ---------- 遥控器 ----------
  window.TV = {
    move: function (dir) {
      if (dir === "left") moveFocus(-1);
      else if (dir === "right") moveFocus(1);
    },
    select: function () { choose(focus); },
    replay: function () { replay(); },
    back: function () { nativeCall("exitToLauncher"); }
  };

  // 再听一遍：重播当前题干（遥控器 MENU 键）
  function replay() {
    if (locked || !round || !round.question) return;
    play(audioName(round.question, -1));
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft") { e.preventDefault(); moveFocus(-1); }
    else if (k === "ArrowRight") { e.preventDefault(); moveFocus(1); }
    else if (k === "Enter" || k === " ") { e.preventDefault(); choose(focus); }
    else if (k === "m" || k === "M") { e.preventDefault(); replay(); }
  });

  window.SOTV_RESUME = function () { if (!round) nextRound(); };

  // 稍等 WebView 注入原生桥后再开始
  setTimeout(nextRound, 250);
})();
</script>
</body>
</html>
