<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BabyTV</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0B1020;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: #fff;
    -webkit-user-select: none; user-select: none;
  }
  #app {
    width: 100%; height: 100%;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-orient: vertical; -webkit-flex-direction: column; flex-direction: column;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    padding: 4vh 5vw;
  }
  /* 题干 */
  #stem {
    font-size: 5.2vh;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-align: center;
    line-height: 1.35;
    color: #EAF0FF;
    text-shadow: 0 0.4vh 1.6vh rgba(0,0,0,.55);
    max-height: 22vh;
    overflow: hidden;
    margin-bottom: 3.5vh;
  }
  /* 选项：巨大卡片横排（用 margin 间距，兼容老 WebView 的 flex gap 缺失） */
  #options {
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    width: 100%;
  }
  .card {
    width: 26vw; height: 26vw;
    max-width: 380px; max-height: 380px;
    min-width: 180px; min-height: 180px;
    display: -webkit-box; display: -webkit-flex; display: flex;
    -webkit-box-align: center; -webkit-align-items: center; align-items: center;
    -webkit-box-pack: center; -webkit-justify-content: center; justify-content: center;
    border-radius: 4vh;
    background: #1C2440;
    background: -webkit-linear-gradient(top, #1C2440, #141A2E);
    background: linear-gradient(160deg, #1C2440, #141A2E);
    border: 0.7vh solid rgba(255,255,255,.10);
    box-shadow: 0 1.6vh 4vh rgba(0,0,0,.45);
    font-size: 12vw;
    font-weight: 900;
    line-height: 1;
    color: #FFFFFF;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-transition: -webkit-transform .12s ease, border-color .12s ease;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .card .label {
    display: block; width: 100%;
    text-align: center;
    line-height: 1.05;
    white-space: normal;
    word-break: normal;
    overflow-wrap: normal; word-wrap: normal;
    pointer-events: none;
  }
  .card + .card { margin-left: 4vw; }
  .card.en { font-size: 7.2vw; }
  .card.focused {
    border-color: #35E0B0;
    -webkit-transform: scale(1.06);
    transform: scale(1.06);
    box-shadow: 0 0 3vh rgba(53,224,176,.55), 0 1.6vh 4vh rgba(0,0,0,.45);
  }
  .card.correct {
    border-color: #35E0B0;
    background: #0C4436;
    background: -webkit-linear-gradient(top, #0C4436, #07281F);
    background: linear-gradient(160deg, #0C4436, #07281F);
  }
  .card.wrong {
    border-color: #FF5A6E;
    background: #4A1220;
    background: -webkit-linear-gradient(top, #4A1220, #2A0A12);
    background: linear-gradient(160deg, #4A1220, #2A0A12);
  }
  /* 底部提示 */
  #hint {
    font-size: 2.2vh;
    color: rgba(255,255,255,.32);
    letter-spacing: .18em;
    margin-top: 3.5vh;
  }
  #toast {
    position: fixed; left: 0; right: 0; top: 6vh;
    text-align: center;
    font-size: 2.4vh; color: rgba(255,255,255,.45);
    opacity: 0; -webkit-transition: opacity .3s; transition: opacity .3s;
  }
  /* 触摸设备按钮（电视遥控器上隐藏） */
  #parent, #replayBtn { display: none; }
  body.touch #parent, body.touch #replayBtn {
    display: block; position: fixed; z-index: 5;
    background: rgba(255,255,255,.08); color: rgba(255,255,255,.72);
    border: 1px solid rgba(255,255,255,.18); border-radius: 999px;
    font-family: inherit; -webkit-appearance: none; outline: none;
  }
  body.touch #parent { top: 2vh; right: 3vw; padding: 1.2vh 3vw; font-size: 2.2vh; }
  body.touch #replayBtn { right: 3vw; bottom: 3vh; padding: 1.6vh 4vw; font-size: 2.4vh; }
  /* ---------- 手机 / 平板适配（电视横屏不受影响） ---------- */
  @media (max-width: 900px) {
    #app { padding: 3vh 4vw; }
    #stem { font-size: 4.6vh; margin-bottom: 2.5vh; max-height: 24vh; letter-spacing: .04em; }
    #options { width: 100%; }
    .card {
      width: auto; height: 34vh;
      min-width: 0; min-height: 0; max-width: none; max-height: none;
      -webkit-box-flex: 1; -webkit-flex: 1 1 0; flex: 1 1 0;
      padding: 0 1vw;
      border-radius: 3vh;
      font-size: 9vw;
      line-height: 1.05;
    }
    .card + .card { margin-left: 2.5vw; }
    .card.en { font-size: 5.5vw; }
    #hint { font-size: 2vh; margin-top: 2.5vh; letter-spacing: .05em; }
  }
  @media (max-width: 900px) and (orientation: landscape) {
    #stem { font-size: 7vh; }
    .card { height: 42vh; font-size: 10vw; }
    .card.en { font-size: 6vw; }
    #hint { margin-top: 2vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stem">准备开始…</div>
  <div id="options"></div>
  <div id="hint">← → 选择　OK 确认　MENU 再听一遍</div>
</div>
<button id="parent" type="button">家长</button>
<button id="replayBtn" type="button">🔊 再听一遍</button>
<div id="toast"></div>

<script>
(function () {
  "use strict";

  var round = null;      // 当前一轮（id / nonce / question）
  var cards = [];
  var focus = 0;
  var locked = false;    // 判题与播放反馈期间锁定输入
  var failed = 0;
  var stem = document.getElementById("stem");
  var optionsBox = document.getElementById("options");
  var toastBox = document.getElementById("toast");
  var hintBox = document.getElementById("hint");
  var parentBtn = document.getElementById("parent");
  var replayBtn = document.getElementById("replayBtn");

  var isTouch = !!('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0;
  if (isTouch) document.body.className += " touch";

  // ---------- 原生桥 ----------
  function nativeCall(name, args) {
    try {
      var api = window.SOTVNative;
      if (api && typeof api[name] === "function") return api[name].apply(api, args || []);
    } catch (e) { }
    return null;
  }
  var browserAudio = null;
  function play(file) {
    if (!file) return;
    if (window.SOTVNative && typeof window.SOTVNative.playAudio === "function") {
      nativeCall("playAudio", [file]);
      return;
    }
    // 手机/平板用浏览器打开电视地址时，用 HTML5 Audio 播放
    try {
      if (!browserAudio) browserAudio = new Audio();
      browserAudio.pause();
      browserAudio.src = "/audio/" + encodeURIComponent(file);
      browserAudio.currentTime = 0;
      var p = browserAudio.play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) { }
  }
  function token() { return nativeCall("apiToken") || window.__BTV_TOKEN || ""; }

  function toast(text) {
    toastBox.textContent = text || "";
    toastBox.style.opacity = text ? "1" : "0";
  }

  // 用 XHR 而不是 fetch：Android 7 自带 WebView 可能低于 Chrome 57
  function post(path, body, ok, fail) {
    var xhr = new XMLHttpRequest();
    var done = false;
    function finish(fn, arg) { if (done) return; done = true; fn(arg); }
    try {
      xhr.open("POST", path, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      var t = token();
      if (t) xhr.setRequestHeader("X-Device-Token", t);
      xhr.timeout = 8000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          var data = null;
          try { data = JSON.parse(xhr.responseText); } catch (e) { }
          if (data) finish(ok, data); else finish(fail);
        } else {
          finish(fail, xhr.status);
        }
      };
      xhr.ontimeout = function () { finish(fail, 0); };
      xhr.onerror = function () { finish(fail, 0); };
      xhr.send(JSON.stringify(body || {}));
    } catch (e) {
      finish(fail);
    }
  }

  // ---------- 渲染 ----------
  function isEnglish(text) { return /[A-Za-z]/.test(String(text)); }

  function render(r) {
    round = r;
    // 关键：答题成功时服务端会直接返回下一题（result.next），走的是 render 而不是 nextRound，
    // 这里必须解除锁定，否则答完第一题后 locked 永远为 true，第二题遥控器/触摸全部失效。
    locked = false;
    failed = 0;
    var q = r.question || r;
    stem.textContent = q.q || "";
    optionsBox.innerHTML = "";
    cards = [];

    var list = q.a || [];
    for (var i = 0; i < list.length; i++) {
      var el = document.createElement("div");
      el.className = "card" + (isEnglish(list[i]) ? " en" : "");
      var label = document.createElement("span");
      label.className = "label";
      label.textContent = list[i];
      el.appendChild(label);
      el.setAttribute("role", "option");
      el.onclick = (function (index) { return function (e) { if (e && e.preventDefault) e.preventDefault(); choose(index); }; })(i);
      el.addEventListener("touchend", (function (index) {
        return function (e) { if (e && e.preventDefault) e.preventDefault(); choose(index); };
      })(i), false);
      optionsBox.appendChild(el);
      cards.push(el);
    }

    focus = 0;
    paintFocus();
    layoutCards();
    play(audioName(q, -1));   // 题目一出现就朗读题干
  }

  // 让长单词/长句自动缩到卡片内（电视、平板、手机共用）
  function fitCard(el) {
    var label = el.querySelector(".label");
    if (!label) return;
    el.style.fontSize = "";
    var cs = window.getComputedStyle(el);
    var size = parseFloat(cs.fontSize) || 40;
    var boxH = el.clientHeight - 8;
    var guard = 0;
    while ((label.scrollWidth > el.clientWidth + 1 || label.scrollHeight > boxH + 1) && size > 10 && guard < 30) {
      size = Math.max(10, size * 0.9);
      el.style.fontSize = size + "px";
      guard++;
    }
  }

  function layoutCards() {
    if (!cards.length) return;
    for (var i = 0; i < cards.length; i++) fitCard(cards[i]);
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layoutCards, 200);
  });

  function audioName(q, index) {
    if (!q || !q.id) return "";
    return index < 0 ? q.id + ".mp3" : q.id + "_opt_" + index + ".mp3";
  }

  function paintFocus() {
    for (var i = 0; i < cards.length; i++) {
      var on = (i === focus);
      if (on) cards[i].className = cards[i].className.replace(/\s*focused/g, "") + " focused";
      else cards[i].className = cards[i].className.replace(/\s*focused/g, "");
    }
  }

  function moveFocus(delta) {
    if (locked || !cards.length) return;
    var next = focus + delta;
    if (next < 0 || next >= cards.length) return;
    focus = next;
    paintFocus();
    play(audioName(round.question, focus));  // 只有左右切换才读选项
  }

  // ---------- 取题 ----------
  function nextRound() {
    locked = false;
    failed = 0;
    post("/api/quiz/start", {}, function (data) {
      if (data.question) { render(data); return; }
      if (data.next && data.next.question) { render(data.next); return; }
      if (data.pending) { toast("等待家长批改"); return; }
      if (data.blocked) { showIdle("今天的学习时间结束啦"); return; }
      if (data.watching) { showIdle("先看会儿动画吧"); return; }
      if (data.reviewed) { toast("已批改"); nextRound(); return; }
      retry();
    }, retry);
  }

  function showIdle(text) {
    stem.textContent = text;
    optionsBox.innerHTML = "";
    cards = [];
  }

  function retry() {
    failed = failed + 1;
    showIdle(failed > 3 ? "连接失败，请重启应用" : "加载中…");
    setTimeout(nextRound, Math.min(1200 * failed, 5000));
  }

  // ---------- 答题 ----------
  function choose(index) {
    if (locked || !round || !cards.length) return;
    locked = true;
    focus = index;
    paintFocus();

    post("/api/quiz/answer", {
      roundId: round.id,
      nonce: round.nonce,
      selections: [index],
      text: "",
      drawing: ""
    }, function (result) {
      if (result.error || result.pending || result.blocked) {
        locked = false;
        toast("请稍后再试");
        return;
      }
      var correct = !!result.correct;
      cards[index].className += correct ? " correct" : " wrong";
      play(correct ? "sfx_correct.mp3" : "sfx_wrong.mp3");  // 先播反馈，再切题

      if (!correct) {
        // 答错：先让孩子看到正确答案，再把正确选项念一遍
        var arr = result.correctIndices || [];
        var answerIndex = arr.length ? Number(arr[0]) : -1;
        if (answerIndex >= 0 && cards[answerIndex]) {
          setTimeout(function () {
            cards[answerIndex].className += " correct";
            play(audioName(round.question, answerIndex));
          }, 1500);
        }
      }
      setTimeout(function () {
        if (result.next && result.next.question) render(result.next);
        else nextRound();
      }, correct ? 1500 : 3600);
    }, function (status) {
      locked = false;
      toast(status === 403 ? "请用 BabyTV App 作答" : "网络异常（" + (status || "无响应") + "）");
    });
  }

  // ---------- 遥控器 ----------
  window.TV = {
    move: function (dir) {
      if (dir === "left") moveFocus(-1);
      else if (dir === "right") moveFocus(1);
    },
    select: function () { choose(focus); },
    replay: function () { replay(); },
    back: function () { nativeCall("exitToLauncher"); }
  };

  // 再听一遍：重播当前题干（遥控器 MENU 键）
  function replay() {
    if (locked || !round || !round.question) return;
    play(audioName(round.question, -1));
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowLeft") { e.preventDefault(); moveFocus(-1); }
    else if (k === "ArrowRight") { e.preventDefault(); moveFocus(1); }
    else if (k === "Enter" || k === " ") { e.preventDefault(); choose(focus); }
    else if (k === "m" || k === "M") { e.preventDefault(); replay(); }
  });

  window.SOTV_RESUME = function () { if (!round) nextRound(); };

  // ---------- 手机 / 平板：触摸操作 ----------
  if (isTouch && hintBox) hintBox.textContent = "点选项作答 · 长按题干进家长";

  function openParentPanel() {
    if (window.SOTVNative && typeof window.SOTVNative.openParent === "function") {
      nativeCall("openParent");
      return;
    }
    location.href = "/admin";   // 手机浏览器：直接打开电视上的家长面板
  }

  if (replayBtn) replayBtn.onclick = function (e) { if (e) e.preventDefault(); replay(); };
  if (parentBtn) parentBtn.onclick = function (e) { if (e) e.preventDefault(); openParentPanel(); };

  // 长按题干 1.5 秒也能进家长面板
  var holdTimer = null;
  function holdEnd() { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }
  function holdStart() { holdEnd(); holdTimer = setTimeout(openParentPanel, 1500); }
  if (stem) {
    stem.addEventListener("touchstart", holdStart, false);
    stem.addEventListener("touchend", holdEnd, false);
    stem.addEventListener("touchmove", holdEnd, false);
    stem.addEventListener("touchcancel", holdEnd, false);
    stem.addEventListener("mousedown", holdStart, false);
    stem.addEventListener("mouseup", holdEnd, false);
    stem.addEventListener("mouseleave", holdEnd, false);
  }
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  // 浏览器首次触摸后解锁音频（自动播放策略）；App 内使用原生播放器，不需要
  if (!window.SOTVNative) {
    var audioUnlocked = false;
    var unlockAudio = function () {
      if (audioUnlocked) return;
      audioUnlocked = true;
      if (round && round.question) play(audioName(round.question, -1));
    };
    document.addEventListener("touchstart", unlockAudio, true);
    document.addEventListener("mousedown", unlockAudio, true);
  }

  // 稍等 WebView 注入原生桥后再开始
  setTimeout(nextRound, 250);
})();
</script>
</body>
</html>
